# Motion Detection Examples Configuration
#
# This project demonstrates MOTION DETECTION (finding moving objects on screen),
# not mouse movement control. For mouse control examples, see the mouse-movement project.

spring:
  application:
    name: motion-detection-examples
  main:
    banner-mode: off

# Brobot Configuration
brobot:
  core:
    # Run in mock mode for examples - simulates motion detection without real screen capture
    mock: true
    # Enable verbose logging to see motion detection details
    verbose: true

  # Action settings
  action:
    # Maximum wait time for actions (seconds)
    max-wait: 5

  # Find settings - used for pattern matching if combined with motion detection
  find:
    similarity: 0.8

  # NOTE: The configuration below is NOT used by motion detection examples.
  # These settings would be used if this were a mouse movement control project.
  # They are preserved for reference but do not affect MotionFindOptions.

  # Movement settings (NOT USED - for reference only)
  movement:
    default-move-time: 0.5    # Would control MouseMoveOptions if implemented
    default-pattern: SMOOTH    # Would control movement patterns if implemented

  # Drag settings (NOT USED - for reference only)
  drag:
    default-hold-time: 0.5     # Would control DragOptions if implemented
    default-speed: NORMAL       # Would control drag speed if implemented

  # Scroll settings (NOT USED - for reference only)
  scroll:
    default-clicks: 3          # Would control ScrollOptions if implemented
    default-pause: 0.1         # Would control scroll timing if implemented

# Mouse movement configuration (NOT USED - for reference only)
# These settings would be used for MouseMoveOptions, DragOptions, and ScrollOptions
# which are NOT implemented in this motion detection example.
mouse:
  movement:
    patterns:
      - SMOOTH
      - LINEAR
      - SIGMOID
      - RANDOM
  speed:
    slow: 2.0
    normal: 1.0
    fast: 0.3

# Logging configuration
logging:
  level:
    root: INFO
    com.example.movement: DEBUG
    io.github.jspinak.brobot: INFO
    # Motion detection logging
    io.github.jspinak.brobot.action.basic.find.motion: DEBUG
    io.github.jspinak.brobot.action.basic.find: DEBUG
  pattern:
    console: '%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n'
