<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=latest/index.html">
    <title>Brobot API Documentation</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            text-align: center;
            padding: 3rem;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-width: 600px;
        }
        h1 {
            color: #333;
            margin-bottom: 1rem;
            font-size: 2.5rem;
        }
        .subtitle {
            color: #666;
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }
        .versions {
            margin: 2rem 0;
            padding: 1rem;
            background: #f8f9fa;
            border-radius: 8px;
        }
        .version-link {
            display: block;
            padding: 0.75rem;
            margin: 0.5rem 0;
            background: white;
            border: 2px solid #667eea;
            border-radius: 6px;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .version-link:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }
        .version-link.latest {
            background: #667eea;
            color: white;
        }
        .version-link.latest:hover {
            background: #5568d3;
        }
        .info {
            color: #666;
            font-size: 0.9rem;
            margin-top: 1.5rem;
        }
        a {
            color: #667eea;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 Brobot API Documentation</h1>
        <p class="subtitle">JavaDoc API Reference</p>

        <div class="versions">
            <h2 style="color: #333; font-size: 1.3rem; margin-bottom: 1rem;">Available Versions</h2>

            <a href="latest/index.html" class="version-link latest">
                📘 Latest (1.1.0)
            </a>

            <a href="1.1.0/index.html" class="version-link">
                📗 Version 1.1.0
            </a>

            <a href="1.0.7/index.html" class="version-link">
                📙 Version 1.0.7
            </a>
        </div>

        <p class="info">
            Redirecting to the latest version...<br>
            If you are not redirected, please select a version above.
        </p>

        <p class="info">
            📚 <a href="../../docs/intro">Documentation</a> |
            🐙 <a href="https://github.com/jspinak/brobot">GitHub</a> |
            📦 <a href="https://central.sonatype.com/artifact/io.github.jspinak/brobot">Maven Central</a>
        </p>
    </div>
</body>
</html>
